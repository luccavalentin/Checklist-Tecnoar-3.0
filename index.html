<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tecnoar — Sistema Operacional</title>
    <meta name="description" content="Sistema operacional Tecnoar Freios: recepção, ordens de serviço, pátio, checklists técnicos e laboratório de peças." />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tecnoar Checklist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#081830" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />

    <script>
      // Aplica o tema antes da primeira pintura para não haver flash.
      (function () {
        try {
          // Claro e o padrao da casa: a oficina trabalha em ambiente iluminado,
          // e o aparelho no modo escuro nao deve decidir isso pelo sistema.
          var t = localStorage.getItem('tecnoar.tema') || 'claro'
          var escuro =
            t === 'escuro' ||
            (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', escuro)
        } catch (e) {
          /* localStorage indisponível: mantém o padrão escuro do markup */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
