# nginx DENTRO do container do Checklist Tecnoar.
# TLS, domínio e certificados são responsabilidade do Traefik na borda;
# aqui só existe HTTP simples na porta 8080.

server {
    # Padrão: o Checklist responde a qualquer domínio que não seja o do SOS
    # (inclusive o healthcheck, que chama 127.0.0.1).
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. ATENÇÃO: o nginx não herda `add_header` num
    # `location` que define os seus — quem define (ex.: /index.html, que é
    # por onde passa TODA tela do sistema) precisa repetir estes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microfone liberado para o próprio site: o app SOS grava o áudio em que o
    # motorista descreve o problema. Continua bloqueado para qualquer iframe.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    # Ninguém embute o sistema num iframe de outro site (clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Só HTTPS a partir da primeira visita (o Traefik já redireciona o HTTP).
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Assets com hash no nome: imutáveis.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # O service worker nunca pode ficar em cache: é ele que entrega as
    # atualizações. Cache aqui congela a versão instalada no dispositivo.
    location ~ ^/(sw|sw-notificacoes)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Toda rota do sistema cai aqui (fallback do react-router): os cabeçalhos
    # de segurança têm de estar neste bloco, não só no `server`.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # O mime.types do nginx não conhece `.webmanifest`, e o manifesto saía como
    # application/octet-stream. Um `types` dentro do location substitui o mapa
    # herdado em vez de acrescentar a ele — por isso o mapa vazio mais o
    # default_type, que valem só para este arquivo.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # O app SOS Tecnoar mora no subdomínio dele. Link antigo em /app/... vai
    # para o mesmo caminho lá.
    location ~ ^/app(?:/(.*))?$ {
        return 301 https://sos.tecnoarsistemas.com.br/$1$is_args$args;
    }

    # Fallback do react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── App SOS Tecnoar (cliente e mecânico) ─────────────────────────────────
#
#   ⚠ EM MANUTENÇÃO — o app SOS está fora do ar de propósito.
#
#   Só este subdomínio. O Checklist (bloco acima) segue no ar, normal.
#
#   Para religar o app: `git revert` do commit que ligou a manutenção — ele
#   devolve este bloco inteiro como era — e `deploy/publicar.sh`. O conteúdo
#   do app continua na imagem, em dist/app; nada foi apagado.
#
# Tirar o site do ar não basta: quem instalou o PWA abre a versão em cache do
# service worker e nem percebe. Por isso /sw.js passa a servir um service
# worker de desligamento, que apaga os caches, se desregistra e manda as telas
# abertas recarregarem — caindo aqui, na página de manutenção.
server {
    listen 8080;
    server_name sos.tecnoarsistemas.com.br;

    root /usr/share/nginx/html/app;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript;

    # O healthcheck do container não pode cair junto com o app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # O service worker de desligamento, no lugar do que o PWA instalou.
    # Sem cache nenhum: é ele que precisa chegar primeiro.
    location = /sw.js {
        alias /usr/share/nginx/html/manutencao/sw.js;
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw-notificacoes.js {
        alias /usr/share/nginx/html/manutencao/sw.js;
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Tudo o mais é manutenção: 503 (o robô entende que é temporário) com a
    # página, e Retry-After para ninguém guardar isso como permanente.
    location / {
        return 503;
    }

    error_page 503 /manutencao.html;
    location = /manutencao.html {
        internal;
        alias /usr/share/nginx/html/manutencao/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Retry-After "3600" always;
    }
}
