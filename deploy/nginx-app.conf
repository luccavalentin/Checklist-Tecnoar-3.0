# nginx DENTRO do container do Checklist Tecnoar.
# TLS, domínio e certificados são responsabilidade do Traefik na borda;
# aqui só existe HTTP simples na porta 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Assets com hash no nome: imutáveis.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # O service worker nunca pode ficar em cache: é ele que entrega as
    # atualizações. Cache aqui congela a versão instalada no dispositivo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # O mime.types do nginx não conhece `.webmanifest`, e o manifesto saía como
    # application/octet-stream. Um `types` dentro do location substitui o mapa
    # herdado em vez de acrescentar a ele — por isso o mapa vazio mais o
    # default_type, que valem só para este arquivo.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback do react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
